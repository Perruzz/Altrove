<svg xmlns="http://www.w3.org/2000/svg" width="360" height="104" viewBox="0 0 360 104" role="img" aria-label="Download the APK">
  <title>Download the APK</title>
  <defs>
    <!-- The violet of the app icon. -->
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9D8FFF"/>
      <stop offset="0.55" stop-color="#5B4FE8"/>
      <stop offset="1" stop-color="#3A2FBF"/>
    </linearGradient>
    <!-- Glass: light on the upper half only. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#5B4FE8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="14" y="10" width="332" height="72" rx="36" fill="url(#fill)" filter="url(#glow)"/>
  <rect x="14" y="10" width="332" height="72" rx="36" fill="url(#sheen)"/>
  <rect x="14.75" y="10.75" width="330.5" height="70.5" rx="35.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- A few stars, as in the app's sky. -->
  <g fill="#FFFFFF">
    <circle cx="306" cy="25" r="1.3" opacity="0.8"/>
    <circle cx="331" cy="37" r="1" opacity="0.55"/>
    <circle cx="300" cy="69" r="0.9" opacity="0.5"/>
    <circle cx="328" cy="64" r="1.2" opacity="0.7"/>
    <path d="M316,39 C316.7,43 317.9,44.3 322,45 C317.9,45.7 316.7,47 316,51 C315.3,47 314.1,45.7 310,45 C314.1,44.3 315.3,43 316,39Z" opacity="0.9"/>
  </g>

  <!-- Download arrow in a soft circle. -->
  <circle cx="58" cy="46" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
  <path transform="translate(43.6 31.6) scale(1.2)" fill="#FFFFFF" d="M19,9h-4V3H9v6H5l7,7 7,-7zM5,18v2h14v-2H5z"/>

  <text x="96" y="43" fill="#FFFFFF" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="0.2">Download APK</text>
  <text x="96" y="64" fill="#E7E2FF" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500">Android 8.0+ · latest version</text>
</svg>
